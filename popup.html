<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2>SyncClick 控制台</h2>

  <div class="section">
    <label class="switch">
      <input type="checkbox" id="masterSwitch">
      <span class="slider"></span> 啟用自動化(Sync)
    </label>
  </div>

  <div class="section">
    <h3>1. 選擇發送源 (Source Tab)</h3>
    <div id="sourceTabList" class="scroll-box">
      </div>
  </div>

  <div class="section">
    <h3>2. 選擇目標接收分頁 (Target Tab)</h3>
    <div id="targetTabList" class="scroll-box">
      </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
